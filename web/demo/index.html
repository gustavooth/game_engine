<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>EGN - WebGPU Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --egn-fg: #e8eefc;
        --egn-muted: #9fb0d0;
        --egn-accent: #6fb6ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--egn-fg);
      }
      #egn-canvas { display: block; width: 100vw; height: 100vh; outline: none; }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: min(720px, calc(100vw - 32px));
        padding: 12px 14px;
        border: 1px solid rgba(111, 182, 255, 0.25);
        border-radius: 10px;
        background: rgba(5, 10, 22, 0.72);
        backdrop-filter: blur(8px);
        font-size: 13px;
        line-height: 1.55;
        color: var(--egn-muted);
        pointer-events: none;
      }
      #hud strong { color: var(--egn-fg); font-size: 14px; letter-spacing: 0.02em; }
      kbd {
        display: inline-block;
        padding: 1px 6px;
        border: 1px solid rgba(159, 176, 208, 0.35);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--egn-fg);
        font: inherit;
        font-size: 12px;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
        background: radial-gradient(circle at 50% 40%, #12203a, #05070d 70%);
        color: var(--egn-muted);
        font-size: 16px;
        z-index: 10;
        transition: opacity 240ms ease;
      }
      #status.hidden { opacity: 0; pointer-events: none; }
      #status strong { color: var(--egn-fg); display: block; font-size: 22px; margin-bottom: 8px; }
      #status .error { color: #ff9b9b; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="egn-canvas" tabindex="0"></canvas>
    <div id="status"><div><strong>EGN</strong>Carregando WebAssembly + WebGPU...</div></div>
    <div id="hud"></div>

    <script type="module">
      import createEgnModule from './engine.js';
      import * as EGN from './web/sdk/egn.js';
      import { startDemo } from './web/demo/main.js';

      startDemo(EGN, createEgnModule).catch((error) => {
        const status = document.querySelector('#status');
        if (status) {
          status.classList.remove('hidden');
          status.innerHTML = `<div class="error"><strong>Falha ao iniciar</strong>${String(error?.stack || error)}</div>`;
        }
        console.error(error);
      });
    </script>
  </body>
</html>
